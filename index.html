<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      /* Served under a sub-path by a proxy rewrite (e.g. connorgallic.com/ask, no trailing
         slash)? Resolve ./assets and ./api against that path, not the site root. */
      if (!location.pathname.endsWith("/")) { var b = document.createElement("base"); b.href = location.pathname + "/"; document.head.appendChild(b); }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ask</title>
    <meta name="description" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link id="favicon" rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="booting">
    <div class="grain" aria-hidden="true"></div>

    <main class="shell" id="shell">
      <header class="masthead" id="masthead">
        <a class="wordmark" href="#top" id="wordmark">
          <span class="wordmark-name" id="brand-name"></span>
          <span class="wordmark-sub" id="brand-sub"></span>
        </a>
        <div class="masthead-right">
          <button class="reset-btn" id="reset-btn" type="button" hidden>
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>
            <span>Start over</span>
          </button>
          <a class="phone-link" id="header-cta" href="#" target="_blank" rel="noopener"><span class="phone-dot"></span><span id="header-cta-label"></span></a>
        </div>
      </header>

      <section class="gateway" id="top">
        <div class="gateway-inner" id="gateway-inner">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 class="hero-line" id="hero-line"></h1>
          <p class="hero-prompt" id="hero-prompt"></p>

          <form class="ask" id="ask-form" autocomplete="off">
            <div class="ask-field">
              <svg class="ask-spark" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6L12 2z" fill="currentColor"/></svg>
              <input id="ask-input" type="text" placeholder="" aria-label="Describe your situation in your own words" required />
              <button type="button" class="mic" id="mic-btn" aria-label="Speak instead of typing">
                <span class="mic-rings" aria-hidden="true"></span>
                <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z" /><path d="M19 11a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-3.06A9 9 0 0 0 21 11h-2z" /></svg>
              </button>
            </div>
            <button type="submit" class="ask-go" id="ask-go">
              <span id="ask-go-label">Get my answer</span>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
            </button>
          </form>
          <p class="mic-status" id="mic-status" aria-live="polite">Type it, or tap the mic and just talk.</p>

          <div class="chips" id="chips"><span class="chips-label">Or start here —</span></div>
          <ul class="proof" id="proof"></ul>
        </div>
      </section>

      <section class="answer" id="answer" hidden aria-live="polite"></section>

      <div id="homepage">
        <section class="band episodes-band">
          <div class="band-head">
            <span class="kicker">On the record</span>
            <h2 id="featured-h"></h2>
            <p id="featured-p"></p>
          </div>
          <div class="ep-grid" id="ep-grid"></div>
        </section>
      </div>

      <footer class="site-footer">
        <p class="disclaimer" id="disclaimer"></p>
        <p class="copyright" id="footer-line"></p>
        <p class="powered" id="powered" hidden></p>
      </footer>
    </main>

    <div class="sheet-scrim" id="sheet-scrim" hidden></div>
    <aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
      <button class="sheet-close" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="sheet-body" id="sheet-body"></div>
    </aside>

    <div class="vid-scrim" id="vid-scrim" hidden>
      <div class="vid-modal" role="dialog" aria-modal="true" aria-label="Video">
        <button class="vid-close" id="vid-close" aria-label="Close video">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <div class="vid-stage" id="vid-stage"></div>
      </div>
    </div>

    <a class="sticky-call" href="#" id="sticky-call" target="_blank" rel="noopener" hidden><span id="sticky-label"></span></a>

    <script src="./script.js"></script>
  </body>
</html>
